plugins {
    id "com.android.application"
}

android {
    namespace "com.majorturkey.receiver"
    compileSdk 35

    defaultConfig {
        applicationId "com.majorturkey.receiver"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            def store = System.getenv("RECEIVER_KEYSTORE")
            if (store) {
                storeFile file(store)
                storePassword System.getenv("RECEIVER_STORE_PASS")
                keyAlias "upload"
                keyPassword System.getenv("RECEIVER_KEY_PASS")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv("RECEIVER_KEYSTORE")) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
